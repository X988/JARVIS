name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Confirm Node 24
        run: node -v | grep -E '^v24\.'
      - run: npm ci
      - name: Install ffmpeg for voice tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - run: npm run security:secrets
      - run: npm run security:policy
      - run: npm run security:audit
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > /tmp/jarvis-sbom.cdx.json && node -e "const fs=require('fs'); const p='/tmp/jarvis-sbom.cdx.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.bomFormat!=='CycloneDX'||!Array.isArray(j.components)) process.exit(1)"
      - run: npm run build
      - run: npm run db:migrate
  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          EXECUTION_MODE: dry-run
          JARVIS_TEST_AUTH: "1"
          VITE_JARVIS_TEST_AUTH: "1"
          CI: "1"
