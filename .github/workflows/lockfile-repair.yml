name: lockfile-repair
on:
  push:
    branches:
      - jarvis/prod-contour
permissions:
  contents: write
jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis/prod-contour
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit canonical lockfile and remove repair workflow
        run: |
          rm .github/workflows/lockfile-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/lockfile-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): synchronize npm lockfile"
          git push origin HEAD:jarvis/prod-contour
