name: verify-improvements

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Node 24
        run: |
          node -v | grep -E '^v24\.'
          node -e "const e=require('./package.json').engines||{}; if(!String(e.node||'').includes('24')) process.exit(1)"

      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build optimization present
        run: |
          grep -q 'manualChunks' vite.config.ts
          grep -q 'target: "es2022"' vite.config.ts
          grep -q 'cssCodeSplit: true' vite.config.ts

      - name: HUD and screen modules
        run: |
          test -f src/components/jarvis/hud.tsx
          test -f src/lib/jarvis/screen/capture.ts
          test -f src/lib/jarvis/screen/server.ts
          test -f docs/UX.md

      - name: Circuit breaker
        run: |
          test -f src/lib/jarvis/plane/llm-circuit.ts
          grep -q 'jarvis_llm_circuit_open_total' src/lib/jarvis/metrics.ts

      - name: Worker lock and heartbeat
        run: |
          grep -q 'worker.lock' scripts/jarvis-worker.mjs
          grep -q 'worker.heartbeat' scripts/jarvis-worker.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Security
        run: |
          npm run security:secrets
          npm run security:policy

      - name: Build
        run: npm run build

      - name: Report
        if: always()
        run: echo "verify-improvements finished"
